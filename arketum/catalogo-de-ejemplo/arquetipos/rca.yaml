# Análisis de causa raíz (RCA).
#
# Parte de no saber: la señal registra que algo falló, y el RCA investiga hasta
# confirmar la causa con evidencia. Su último nivel fija qué se toca (atributo
# `touches`) y cómo se verifica el arreglo (atributos `evidence`, `expect`, `on`).
name: rca
version: 1.0.0
description: >-
  Investigación de un fallo desde la señal hasta la causa confirmada con evidencia, con lo que hay que tocar y cómo se verifica el arreglo. Es el artefacto de trabajo del carril de corrección: fija los tocados y la verificación. Elígelo para explicar un fallo; para pedir algo nuevo corresponde un PRD.
tags: [proceso, fallo, causa]

kinds:
  - name: objetivo
    describes: "pieza de la solicitud (L0): el fallo tal como se reportó o se detectó"
  - name: hipotesis
    describes: una explicación posible del fallo (código, pipeline, entorno o datos)
  - name: causa
    describes: la hipótesis confirmada, con la evidencia que la confirma
  - name: remedio
    describes: "lo que hay que cambiar; atributo `touches`: los artefactos del proyecto, separados por comas"
  - name: verificacion
    describes: "cómo se comprueba el arreglo; atributos `evidence` (clases separadas por comas), `expect` y `on`"
  - name: documento
    describes: el fichero del RCA, en la carpeta de trabajo del paso

extractors:
  - mechanism: path
    kind: documento
    pattern: "<nombre>.md"

levels:
  - id: L0
    requiredRoles: []
    title: SEÑAL
    instruction: >
      Declara el fallo tal como llegó: qué se observó, dónde y quién lo reportó.
      Todavía no se sabe la causa; no la escribas aquí.
  - id: L1
    requiredRoles: []
    title: HIPÓTESIS
    instruction: >
      Declara las hipótesis: en el código, el pipeline, el entorno o los datos.
      Cada una dice qué se esperaría ver si fuera cierta.
    fanout:
      min: 1
      max: 20
  - id: L2
    requiredRoles: []
    title: CAUSA
    instruction: >
      Declara la causa confirmada y con qué evidencia se confirmó. Las hipótesis
      descartadas se quedan en L1; aquí solo lo que resistió la prueba.
    fanout:
      min: 1
      max: 10
  - id: L3
    requiredRoles: []
    title: REMEDIO Y VERIFICACIÓN
    instruction: >
      Declara el remedio (tipo `remedio`, atributo `touches` con los artefactos
      del proyecto que hay que tocar, separados por comas; ninguno si el fallo no
      está en el proyecto), la verificación (tipo `verificacion`, atributos
      `evidence` con las clases que valen, `expect` si admite ejecución y `on`:
      `before` para una prueba que falla antes del cambio, `change` para la que
      pasa con él) y el fichero del RCA (tipo `documento`, con su `location`).
    fanout:
      min: 1
      max: 30
