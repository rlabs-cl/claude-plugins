# A fix starts from not knowing: the signal records the failure, the RCA investigates and fixes what is touched and how
# it is verified.
#
# 2.0.0: the example catalog in English, bilingual; it replaces `correccion` 1.x.
name: fix
version: 2.0.0
language: en
replaces: [correccion]
when:
  en: A failure that was reported or detected, whose cause is not known yet.
  es: Un fallo reportado o detectado, del que todavía no se sabe la causa.
milestones: [deployment, delivery, execution]
steps:
  - id: signal
    kind: evidence
    requires:
      - id: failure
        describes: { en: the failure as it arrived, es: el fallo tal como llegó }
        classes: [execution, report, statement]
        expect: failure
        on: before
  - { id: rca, kind: artifact, archetype: { name: rca }, gate: true, fixesTouches: true, feeds: [system, verification] }
  - { id: system, kind: system, optional: true, fedBy: [rca] }
  - { id: verification, kind: evidence, fedBy: [rca] }
  - id: milestone
    kind: milestone
    optional: true
    gate: true
    confirmation: true
    requires:
      - id: met
        describes: { en: the person confirms the milestone was met, es: la persona confirma que el hito se cumplió }
        classes: [statement]
