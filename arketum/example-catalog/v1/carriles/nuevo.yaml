# Un producto nuevo: del PRD a la arquitectura, que fija los artefactos, y de
# ahí al sistema, aceptado con evidencia.
#
# Cambios:
# - 1.2.0: la aceptación exige además las salidas de los tocados (`salidas: true`).
# - 1.3.0: el hito `despliegue <entorno>` cuenta (`humo: true`): exige la prueba de humo y que el entorno exista.
# - 1.4.0: el hito `despliegue <entorno>` lo cumple la confirmación de la persona por el canal interactivo («¿se desplegó en <entorno> y corrió?», sí o no): la marca `humo` pasa a llamarse `confirmacion` y la prueba de humo deja de exigirse.
name: nuevo
version: 1.4.0
when: Un producto o sistema que todavía no existe, sin proyecto que tocar.
milestones: [despliegue, entrega, ejecucion]
steps:
  - { id: prd, kind: artifact, archetype: { name: prd }, gate: true, levantamiento: true, feeds: [sistema] }
  - { id: arquitectura, kind: artifact, archetype: { name: arquitectura-de-sistema }, gate: true, fixesTouches: true }
  - { id: arquetipo, kind: artifact, archetype: { name: arquetipo-autor }, optional: true, gate: true }
  - { id: sistema, kind: system, fedBy: [prd] }
  - id: aceptacion
    # Además de lo suyo, las salidas de cada tocado cuyo arquetipo efectivo las pide:
    # el suelo y la suite e2e entera, con sus comandos compuestos (`salidas/<artefacto>/…`).
    salidas: true
    kind: evidence
    requires:
      - { id: aceptacion, describes: el producto hace lo que pide el PRD, classes: [execution, statement], expect: success }
  - id: hito
    kind: milestone
    optional: true
    gate: true
    confirmacion: true
    requires:
      - { id: cumplido, describes: la persona confirma que el hito se cumplió, classes: [statement] }
