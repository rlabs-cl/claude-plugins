# Stack: Python, with the standard library and pytest.
#
# A stack is not an archetype: it has no levels nor types of its own. It says where each piece type declared by the
# components of the shapes lives, the craft rules for whoever builds, and its commands (informative). Arketum
# composes it with the component of the variant of the project's shape into an effective archetype.
#
# 2.0.0: the example catalog in English, bilingual; it replaces `python` 1.x (same name).
name: python
version: 2.0.0
language: en
description:
  en: >-
    Python with the standard library and pytest: one package per artifact, with a subfolder per piece type (domain, storage, services, interface, API, clients) and several files in each, `pyproject.toml` at the root of the artifact and the tests in `tests/<group>/`, unit and end-to-end.
  es: >-
    Python con la biblioteca estándar y pytest: un paquete por artefacto, con una subcarpeta por tipo de pieza (dominio, almacén, servicios, interfaz, API, clientes) y varios ficheros en cada una, `pyproject.toml` en la raíz del artefacto y las pruebas en `tests/<group>/`, unitarias y de extremo a extremo.

# Paths relative to the root of the artifact. `<package>` matches any folder name: it is used as ONE package, not a
# folder per type (Arketum does not check that it is the same across the artifact). A type that lives in several
# places carries a list in `pattern`. The exclusions keep a test group named like a type (`tests/domain/`) from
# being claimed by that type.
locations:
  # The loose modules of the package (`config.py`, `errors.py`), its `__init__.py` and `py.typed`, the manifest and
  # the README of the artifact. A loose file named like a type (`domain.py`) is not a module: it is merged code, and
  # its place is the subfolder of the type.
  module:
    pattern: ["<package>/<name>.py", "<package>/py.typed", "pyproject.toml", "README.md"]
    excluding:
      - "<package>/__main__.py"
      - "<package>/domain.py"
      - "<package>/storage.py"
      - "<package>/services.py"
      - "<package>/interface.py"
      - "<package>/api.py"
      - "<package>/clients.py"
      - "tests/<name>.py"
      - "tests/py.typed"
  domain: { pattern: "<package>/domain/<name>.py", excluding: ["tests/domain/<name>.py"] }
  storage: { pattern: "<package>/storage/<name>.py", excluding: ["tests/storage/<name>.py"] }
  service: { pattern: "<package>/services/<name>.py", excluding: ["tests/services/<name>.py"] }
  interface:
    pattern:
      - "<package>/interface/<name>.py"
      - "<package>/interface/templates/<name>.<ext>"
      - "<package>/interface/templates/<folder>/<name>.<ext>"
      - "<package>/interface/static/<name>.<ext>"
      - "<package>/interface/static/<folder>/<name>.<ext>"
    excluding:
      - "tests/interface/<name>.py"
      - "tests/interface/templates/<name>.<ext>"
      - "tests/interface/templates/<folder>/<name>.<ext>"
      - "tests/interface/static/<name>.<ext>"
      - "tests/interface/static/<folder>/<name>.<ext>"
  api: { pattern: "<package>/api/<name>.py", excluding: ["tests/api/<name>.py"] }
  client: { pattern: "<package>/clients/<name>.py", excluding: ["tests/clients/<name>.py"] }
  # `start.sh` at the root of the artifact: the start contract of the shapes (the floor and the e2e helper launch it).
  entrypoint: { pattern: ["<package>/__main__.py", "start.sh"], excluding: ["tests/__main__.py"] }
  # What is in `tests/`, up to three folders below: tests, `conftest.py`, helpers (`helpers.py`, `fixtures.py`),
  # `__init__.py`, nested groups and test data (`tests/data/orders.json`). One pattern per depth: a container
  # (`tests/`) would classify the folders too.
  test:
    pattern: ["tests/<name>.<ext>", "tests/<group>/<name>.<ext>", "tests/<group>/<folder>/<name>.<ext>", "tests/<group>/<folder>/<sub>/<name>.<ext>"]
  # What configures how the tests run: it is not a piece type (a `conftest.py` is also a test and `pyproject.toml` a
  # module). The closing shows it to the person when it changes: it can skip tests without touching them (of
  # `pyproject.toml` and `setup.cfg` it is not known whether their pytest section changed: they show whenever they
  # change).
  test-config:
    pattern:
      - pyproject.toml
      - setup.cfg
      - tox.ini
      - pytest.ini
      - conftest.py
      - tests/conftest.py
      - tests/<group>/conftest.py
      - tests/<group>/<folder>/conftest.py
      - tests/<group>/<folder>/<sub>/conftest.py

# Each sample has to derive exactly its type: it is the overlap check.
samples:
  module: [shop/__init__.py, shop/config.py, shop/errors.py, shop/py.typed, pyproject.toml, README.md]
  domain: [shop/domain/__init__.py, shop/domain/product.py, shop/domain/order.py]
  storage: [shop/storage/__init__.py, shop/storage/repository.py]
  service: [shop/services/__init__.py, shop/services/cart.py, shop/services/admin.py]
  interface: [shop/interface/__init__.py, shop/interface/web.py, shop/interface/templates/cart.html, shop/interface/templates/partials/header.html, shop/interface/static/style.css, shop/interface/static/css/style.css]
  api: [shop/api/__init__.py, shop/api/routes.py]
  client: [shop/clients/__init__.py, shop/clients/payments.py]
  entrypoint: [shop/__main__.py, start.sh]
  test:
    - tests/conftest.py
    - tests/__init__.py
    - tests/helpers.py
    - tests/test_smoke.py
    - tests/unit/__init__.py
    - tests/unit/fixtures.py
    - tests/unit/test_cart.py
    - tests/unit/domain/test_order.py
    - tests/domain/test_order.py
    - tests/interface/test_web.py
    - tests/interface/templates/a.html
    - tests/interface/static/b.css
    - tests/interface/static/css/a.css
    - tests/interface/templates/partials/c.html
    - tests/data/orders.json
    - tests/orders.json
    - tests/e2e/conftest.py
    - tests/e2e/test_purchase.py
  test-config: [pyproject.toml, pytest.ini, tox.ini, setup.cfg, tests/conftest.py, tests/e2e/conftest.py]

# What Python and pytest generate: it is not claimed nor counted as a change.
generated: [__pycache__/, .pytest_cache/]

craft:
  - en: Only the standard library; the tests with pytest. A new dependency is declared in `pyproject.toml` and justified.
    es: Solo la biblioteca estándar; las pruebas con pytest. Una dependencia nueva se declara en `pyproject.toml` y se justifica.
  - en: One file per concept inside the subfolder of its type (`domain/order.py`, `services/cart.py`); everything is not lumped into one.
    es: Un fichero por concepto dentro de la subcarpeta de su tipo (`domain/order.py`, `services/cart.py`); no se junta todo en uno.
  - en: The domain reads no files, nor the terminal, nor the clock, nor the network; the instant comes in as a parameter.
    es: El dominio no lee ficheros, ni la terminal, ni el reloj ni la red; el instante entra como parámetro.
  - en: A failure reading what was saved is not swallowed - it is reported and it stops; it never goes on with nothing nor overwrites.
    es: Un fallo al leer lo guardado no se traga - se avisa y se para; nunca se sigue con vacío ni se sobrescribe.
  - en: Paths to files of the code itself are resolved from `__file__`, never from the working directory.
    es: Las rutas a ficheros del propio código se resuelven desde `__file__`, nunca desde el directorio de trabajo.
  - en: The data folder comes from the environment (`DATA_DIR`), and the tests put it in a temporary folder.
    es: La carpeta de datos sale del entorno (`DATA_DIR`), y las pruebas la ponen en una carpeta temporal.
  - en: '`start.sh` launches the package with the interpreter of the environment (`exec python3 -m <package> "$@"`): it is what the floor and the e2e tests launch.'
    es: '`start.sh` lanza el paquete con el intérprete del entorno (`exec python3 -m <package> "$@"`): es lo que lanzan el suelo y las pruebas e2e.'
  - en: The e2e tests (`tests/e2e/`) start the application with the `app` launcher of the e2e fixture and use it through the real interface, like a person; they never import the package. The fixtures need `pyte` and `pytest` (`python3 -m pip install -r arketum/fixtures/e2e/requirements.txt`), which belong to the tests, not to the product.
    es: Las pruebas e2e (`tests/e2e/`) arrancan la aplicación con el lanzador `app` de la fijación e2e y la usan por la interfaz real, como una persona; nunca importan el paquete. Las fijaciones necesitan `pyte` y `pytest` (`python3 -m pip install -r arketum/fixtures/e2e/requirements.txt`), que son de las pruebas, no del producto.

# Fixed by the catalog: copied as they are into `arketum/fixtures/<name>/` of the artifact and never edited (the
# closing compares their checksum). One per shape and purpose.
fixtures:
  - { from: stacks/python/floor-terminal-game, name: floor, for: floor, shapes: [terminal-game] }
  - { from: stacks/python/floor-layered-app, name: floor, for: floor, shapes: [layered-app] }
  - { from: stacks/python/e2e-terminal, name: e2e, for: e2e, shapes: [terminal-game, layered-app] }

# The arguments with which its test runner (pytest) runs none: a run of the e2e suite with one of them does not count
# as e2e.
notRun: [--co, --collect-only, --collectonly, --trace-config, --help, -h, --version, -V, --fixtures, --fixtures-per-test, --markers, --setup-plan, --setup-only]

commands:
  tests: python3 -m pytest -q --ignore=tests/e2e
  floor: python3 -B arketum/fixtures/floor/floor.py .
  e2e: PYTHONPATH=arketum/fixtures/e2e python3 -B -m pytest -q -c arketum/fixtures/e2e/pytest.ini --rootdir=. tests/e2e

selfReview:
  criteria:
    - check:
        en: No test depends on the network, on the machine clock or on a folder outside the temporary one
        es: Ninguna prueba depende de la red, del reloj de la máquina ni de una carpeta fuera de la temporal
      how:
        en: Read the fixtures and the calls to `datetime.now`, `time.time` and `urllib` from the tests.
        es: Lee las fijaciones y las llamadas a `datetime.now`, `time.time` y `urllib` desde las pruebas.
      evidence: measured
