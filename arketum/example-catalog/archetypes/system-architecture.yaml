# The system architecture.
#
# Its last level is a project proposal: the artifacts with their root, their archetype, their dependencies and what is
# touched together with them; the scaffolding; and the coverage. Once approved, it fixes the touched artifacts
# (elements of type `artifact`). Each artifact carries its fit judgment and, if the person brought what to build it
# with, whether it honors that direction (conventions `fit` and `direction`, both required).
#
# 2.0.0: the example catalog in English, bilingual; it replaces `arquitectura-de-sistema` 1.x.
name: system-architecture
version: 2.0.0
language: en
replaces: [arquitectura-de-sistema]
description:
  en: >-
    A proposal for how a system is split into artifacts: the root, archetype, dependencies and `touchWith` of each one, the scaffolding and the coverage. It is the working artifact of a new product and, optionally, of a feature that adds artifacts. Choose it to decide the shape of the project, not that of one artifact.
  es: >-
    Propuesta de cómo se parte un sistema en artefactos: raíz, arquetipo, dependencias y `touchWith` de cada uno, el andamiaje y la cobertura. Es el artefacto de trabajo de un producto nuevo y, opcional, de una funcionalidad que añade artefactos. Elígelo para decidir la forma del proyecto, no la de un artefacto.
tags:
  - { en: process, es: proceso }
  - { en: architecture, es: arquitectura }
  - { en: project, es: proyecto }

kinds:
  - name: goal
    describes:
      en: "a piece of the request (L0): which system is wanted and under which constraints"
      es: "pieza de la solicitud (L0): qué sistema se quiere y con qué restricciones"
  - name: component
    describes:
      en: a responsibility of the system, before deciding which artifact it lives in
      es: una responsabilidad del sistema, antes de decidir en qué artefacto vive
  - name: artifact
    describes:
      en: >-
        an artifact of the project; id = the artifact's id; attributes `root`, `archetype` (name or name@version) or, with layers, `stack` (name or name@version) and `component` (from the variant of the project's shape), `dependsOn` and `touchWith` (ids separated by commas); and the fit judgment: `fit` (`fits`, `fits_with_caveats` or `does_not_fit`), `why` (the elements of the use case that tip toward this choice; with caveats, which ones) and, with `does_not_fit`, `new` (why none of the existing ones fits and what the one being added would have); if the person brought what to build it with, `direction` (`honors` or `departs`) and, if it departs, `choice` (their answer, literally)
      es: >-
        un artefacto del proyecto; id = el del artefacto; atributos `root`, `archetype` (nombre o nombre@versión) o, con capas, `stack` (nombre o nombre@versión) y `component` (de la variante de la forma del proyecto), `dependsOn` y `touchWith` (ids separados por comas); y el juicio de ajuste: `fit` (`fits`, `fits_with_caveats` o `does_not_fit`), `why` (los elementos del caso de uso que inclinan a esta elección; con reservas, cuáles) y, con `does_not_fit`, `new` (por qué ninguno de los que hay calza y qué tendría el que se agrega); si la persona trajo con qué construirlo, `direction` (`honors` o `departs`) y, si se aparta, `choice` (su respuesta, literal)
  - name: scaffolding
    describes:
      en: "something no archetype governs; attribute `path` (ending in / for a folder)"
      es: "algo que ningún arquetipo gobierna; atributo `path` (acabado en / para una carpeta)"
  - name: coverage
    describes:
      en: "the project's coverage; attribute `value`: `warning` or `blocking`"
      es: "la cobertura del proyecto; atributo `value`: `warning` o `blocking`"
  - name: document
    describes:
      en: the architecture file or a diagram, in the step's working folder
      es: el fichero de la arquitectura o un diagrama, en la carpeta de trabajo del paso

extractors:
  - mechanism: path
    kind: document
    pattern: "<name>.md"

levels:
  - id: L0
    requiredRoles: []
    title: { en: REQUEST, es: SOLICITUD }
    instruction:
      en: >
        Declare which system is wanted, what for, and under which constraints (team,
        platform, deadlines).
      es: >
        Declara qué sistema se quiere, para qué y con qué restricciones (equipo,
        plataforma, plazos).
  - id: L1
    requiredRoles: []
    title: { en: COMPONENTS, es: COMPONENTES }
    instruction:
      en: >
        Declare the system's responsibilities and how they relate, before
        deciding how many artifacts there are.
      es: >
        Declara las responsabilidades del sistema y cómo se relacionan, antes de
        decidir cuántos artefactos hay.
    fanout:
      min: 1
      max: 30
  - id: L2
    requiredRoles: []
    title: { en: PROJECT, es: PROYECTO }
    instruction:
      en: >
        Declare the project proposal: one `artifact` element per artifact (its
        id is the artifact's id; attributes `root`, `archetype` (or, with layers,
        `stack` and `component`), `dependsOn` and `touchWith`), one
        `scaffolding` element per path that no archetype
        governs (attribute `path`), one `coverage` element (attribute `value`) and
        the architecture file (type `document`, with its `location`).
        Each `artifact` carries its fit judgment: whether the choice fits the use case (`fit`: `fits`, `fits_with_caveats` or `does_not_fit`), the elements of the case that tip toward that choice (`why`) and, if nothing in the catalogs fits, `new`: why none fits and what the one being added would have, with a name of its own that does not exist yet. Choose the best alternative for the use case, not the one at hand: creating a new one is always an alternative; if one is added, Arketum includes the step that creates it and the person approves it there. If the person brought what to build it with, each `artifact` says whether the choice honors it (`direction: honors`) or departs from it (`direction: departs`): departing is the person's choice, and their answer goes in `choice`; without it, Arketum gives you the question.
      es: >
        Declara la propuesta de proyecto: un elemento `artifact` por artefacto (su
        id es el del artefacto; atributos `root`, `archetype` —o, con capas,
        `stack` y `component`—, `dependsOn` y `touchWith`), un elemento
        `scaffolding` por ruta que ningún arquetipo
        gobierna (atributo `path`), un elemento `coverage` (atributo `value`) y
        el fichero de la arquitectura (tipo `document`, con su `location`).
        Cada `artifact` lleva su juicio de ajuste: si lo elegido calza con el caso de uso (`fit`: `fits`, `fits_with_caveats` o `does_not_fit`), los elementos del caso que inclinan a esa elección (`why`) y, si nada de lo que hay en los catálogos calza, `new`: por qué ninguno calza y qué tendría el que se agrega, con un nombre propio que no exista. Elige la mejor alternativa para el caso de uso, no la que está a mano: crear uno nuevo siempre es una alternativa; si se agrega, Arketum incluye el paso que lo crea y la persona lo aprueba allí. Si la persona trajo con qué construirlo, cada `artifact` dice si lo elegido lo honra (`direction: honors`) o se aparta (`direction: departs`): apartarse lo elige ella, y su respuesta va en `choice`; sin ella, Arketum te da la pregunta.
    fanout:
      min: 1
      max: 60

# Arketum requires the fit judgment of each artifact in the proposal when the last level is delivered, and also
# whether it honors the stack the person brought, when they brought one.
conventions:
  fit: required
  direction: required
