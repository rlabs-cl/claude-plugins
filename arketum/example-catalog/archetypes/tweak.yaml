# A tweak: a small change on pieces that already exist.
#
# The working artifact of the `tweak` lane: it lives in the unit's folder and feeds the `system` step. Its first level
# is the short radius (which piece it touches and what else it could touch); the last, the requirements, with their
# literal quote of the person's request.
#
# 2.0.0: the example catalog in English, bilingual; it replaces `ajuste` 1.x.
name: tweak
version: 2.0.0
language: en
replaces: [ajuste]
description:
  en: >-
    A small change on pieces that already exist: which piece it touches, what else it could touch and how that would show, and the requirements with their quote of the person's request. It is the working artifact of the `tweak` lane; for something new or large, a PRD is the right one.
  es: >-
    Un cambio chico sobre piezas que ya existen: qué pieza toca, qué más podría tocar y cómo se notaría, y los requisitos con su cita del pedido de la persona. Es el artefacto de trabajo del carril `tweak`; para algo nuevo o grande corresponde un PRD.
tags:
  - { en: process, es: proceso }
  - { en: requirements, es: requisitos }
  - { en: tweak, es: ajuste }

kinds:
  - name: touch
    describes:
      en: "a piece of a touched artifact that the change touches: `artifact` (one of the touched ones) and `piece` (the id of an element in the pieces level of its baseline)"
      es: "una pieza de un tocado que el cambio toca: `artifact` (uno de los tocados) y `piece` (el id de un elemento del nivel de piezas de su línea base)"
  - name: risk
    describes:
      en: what else the change could touch and how it would show in the check; if there is nothing, a single one with id `none` and its `because`
      es: lo que más podría tocar el cambio y cómo se notaría en la comprobación; si no hay, uno solo con id `none` y su `because`
  - name: requirement
    describes:
      en: something concrete the system has to do or meet, with its quote of the request
      es: algo concreto que el sistema tiene que hacer o cumplir, con su cita del pedido
  - name: document
    describes:
      en: the tweak file, in the step's working folder
      es: el fichero del ajuste, en la carpeta de trabajo del paso

extractors:
  - mechanism: path
    kind: document
    pattern: "<name>.md"

levels:
  - id: L0
    requiredRoles: []
    title: { en: RADIUS, es: RADIO }
    instruction:
      en: >
        Declare which piece the change touches, one `touch` per piece, with `artifact` (one
        of the touched ones; each touched artifact, at least one) and `piece` (the id of an element
        in the pieces level of its last certified descent, the one that will be
        inherited). And ask yourself what else this touches: one `risk` for each thing that
        could break, with how it would show in the check (for example, that
        the saved runs replay the same). If there really is none,
        a single `risk` with id `none` and its `because`.
      es: >
        Declara qué pieza toca el cambio, una `touch` por pieza, con `artifact` (uno
        de los tocados; cada tocado, al menos una) y `piece` (el id de un elemento
        del nivel de piezas de su último descenso certificado, el que se va a
        heredar). Y pregúntate qué más toca esto: un `risk` por cada cosa que
        podría romperse, con cómo se notaría en la comprobación (por ejemplo, que
        las corridas guardadas se reproduzcan igual). Si de verdad no hay ninguno,
        un solo `risk` con id `none` y su `because`.
  - id: L1
    requiredRoles: []
    title: { en: REQUIREMENTS, es: REQUISITOS }
    instruction:
      en: >
        Declare the requirements of the tweak and the tweak file (type
        `document`, with its `location`). Each requirement carries the attributes `type`
        (`functional` or `technical`), `requirement` (its short id; with the id of an existing
        one, it is a new version), `title`, `comesFrom` (the literal sentence of the
        person's request, or of their answer to a question), `because` in a
        `technical` one, `acceptance` and, if the unit touches several artifacts,
        `artifact`. Few of them: if it takes more than the lane allows, it is not
        a tweak.
      es: >
        Declara los requisitos del ajuste y el fichero del ajuste (tipo
        `document`, con su `location`). Cada requisito lleva los atributos `type`
        (`functional` o `technical`), `requirement` (su id corto; con el de uno que ya
        existe es una versión nueva), `title`, `comesFrom` (la frase literal del
        pedido de la persona, o de su respuesta a una pregunta), `because` en un
        `technical`, `acceptance` y, si la unidad toca varios artefactos,
        `artifact`. Pocos: si hacen falta más de los que admite el carril, no es
        un ajuste.
    fanout:
      min: 1
      max: 10
